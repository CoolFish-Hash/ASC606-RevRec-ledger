<title>Rev Rec Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: sticky top bar with three tabs; Contracts = list left + editor right; Report = chart, bridge, drillable matrix. */
:root{
  --bg:#F1F4F2;--surface:#FFFFFF;--ink:#14231E;--ink2:#47574F;--muted:#6F7F78;--rule:#D3DCD8;--soft:#E3ECE8;

  --font:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Spline Sans Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1613;--surface:#14211D;--ink:#E6EFEB;--ink2:#B4C4BD;--muted:#8A9B94;--rule:#294038;--soft:#1B2D27;
  --accent:#4FC9A6;--on-accent:#06201A;
  --license:#3987E5;--support:#D95926;--usage:#9085E9;--bill:#199E70;--total:#9CB0A8;
  --warn:#F0B27A;--warn-bg:#35261A;--bad:#FF8A80;--ok:#6FD39A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1613;--surface:#14211D;--ink:#E6EFEB;--ink2:#B4C4BD;--muted:#8A9B94;--rule:#294038;--soft:#1B2D27;
  --accent:#4FC9A6;--on-accent:#06201A;
  --license:#3987E5;--support:#D95926;--usage:#9085E9;--bill:#199E70;--total:#9CB0A8;
  --warn:#F0B27A;--warn-bg:#35261A;--bad:#FF8A80;--ok:#6FD39A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;padding-inline:clamp(16px,3vw,32px);padding-block:0 48px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance;line-height:1.2}
h1{font-size:22px;letter-spacing:-.01em}h2{font-size:18px}h3{font-size:15px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}.sm{font-size:13px}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding-block:14px;border-bottom:1px solid var(--rule);margin-inline:calc(-1*clamp(16px,3vw,32px));padding-inline:clamp(16px,3vw,32px)}
.brand p{margin:0;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:6px;cursor:pointer;color:var(--ink2);font-weight:500}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.tab:not([aria-selected="true"]):hover{background:var(--soft)}
.ghost{border:1px solid var(--rule);background:transparent;border-radius:6px;padding:7px 12px;cursor:pointer;color:var(--ink2)}
.ghost:hover{background:var(--soft)}
.primary{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600}
.danger{border:1px solid var(--bad);background:transparent;color:var(--bad);border-radius:6px;padding:7px 12px;cursor:pointer}
main{padding-top:20px}
/* contracts */
.split{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.side-tools{display:flex;gap:8px}

#list{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:8px;background:var(--surface);max-height:70vh;overflow:auto}

.citem{display:grid;gap:2px;text-align:left;border:0;border-bottom:1px solid var(--rule);background:transparent;padding:10px 12px;cursor:pointer}
.citem:last-child{border-bottom:0}

.pill{display:inline-block;padding:0 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--ink2)}

.editor{display:flex;flex-direction:column;gap:22px;min-width:0}
.ehead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.ehead .acts{display:flex;gap:8px;flex-wrap:wrap}
.summary{display:flex;flex-wrap:wrap;gap:8px 28px;padding:14px 16px;background:var(--surface);border:1px solid var(--rule);border-radius:8px}
.summary div{display:flex;flex-direction:column;min-width:0}

.switch{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:500}

.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--surface);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}

th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;background:var(--soft)}
td.wrap{white-space:normal;text-align:left;min-width:220px;color:var(--ink2)}
.calc h3{margin-bottom:8px}
.calc{display:flex;flex-direction:column;gap:18px}

.cscroll.b svg{min-width:400px}
.issues{padding:10px 14px;border-radius:8px;background:var(--warn-bg);color:var(--warn);margin:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.form{display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--rule);padding-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 16px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:13px;color:var(--ink2);font-weight:500}
.fld small{color:var(--muted);font-size:12px}
input[type=text],input[type=date],input[type=month],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
input[readonly]{background:var(--soft)}
.flags{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px 20px}
.flag{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px}
.flag select{width:84px;flex:none}
/* report */
.ctl{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end;margin-bottom:12px}
.ctl .fld{width:150px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:16px}
.crumbs button{border:0;background:transparent;color:var(--accent);cursor:pointer;padding:2px 4px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.crumbs span.cur{font-weight:600}
.crumbs i{color:var(--muted);font-style:normal}
.charts{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;margin-bottom:20px}
@media (max-width:1000px){.charts{grid-template-columns:minmax(0,1fr)}}
.chartbox{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:14px 14px 10px;min-width:0}
.chartbox h3{margin-bottom:2px}
.chartbox p{margin:0 0 8px}
.cscroll{overflow-x:auto}
.cscroll svg{display:block;min-width:520px;width:100%;height:auto}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink2);margin-bottom:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
svg text{fill:var(--ink2);font-family:var(--font)}
svg .grid{stroke:var(--rule)}
svg .axis{stroke:var(--muted)}
svg .hit{fill:transparent;cursor:pointer}
svg .hit:hover{fill:var(--soft);opacity:.55}
svg .hit:focus-visible{outline:3px solid var(--accent)}
.mx td:first-child,.mx th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.mx th:first-child{background:var(--soft)}
.mx tfoot td:first-child{background:var(--soft)}
.mx .sel{background:var(--soft)}
.mx td.sel{box-shadow:inset 0 0 0 9999px color-mix(in srgb,var(--accent) 8%,transparent)}
.rowbtn{border:0;background:transparent;color:var(--accent);cursor:pointer;font-weight:600;text-align:left;padding:0;text-decoration:underline;text-underline-offset:3px;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.thbtn{border:0;background:transparent;font-weight:600;color:inherit;cursor:pointer;padding:0}
.thbtn:hover{text-decoration:underline}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:6px;font-size:12.5px;white-space:pre;display:none;max-width:260px}
/* settings */
.panel{display:flex;flex-direction:column;gap:14px;max-width:980px}
.panel .sec:first-child{border-top:0;padding-top:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
textarea{min-height:110px;font-family:var(--mono);font-size:12.5px}
.status{min-height:22px;color:var(--ok);font-weight:500}
.status.err{color:var(--bad)}
.empty{padding:28px;text-align:center;color:var(--ink2);border:1px dashed var(--rule);border-radius:8px;background:var(--surface)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<div id="app"></div>
<div id="tip" role="status"></div>

<script>
/* ===== ENGINE: pure revenue logic, no DOM. Mirrors the "Waterfall" and "SSP" tabs of the source sheet. ===== */
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function P(s){if(!s)return null;var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);return m?{y:+m[1],m:+m[2],d:+m[3]}:null}
function dim(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate()}
function dayNum(p){return Math.round(Date.UTC(p.y,p.m-1,p.d)/864e5)}
function ymi(y,m){return y*12+(m-1)}
function fromYmi(i){return{y:Math.floor(i/12),m:(i%12)+1}}
function monLabel(i){var q=fromYmi(i);return MON[q.m-1]+'-'+String(q.y).slice(2)}
function xround(x,n){var f=Math.pow(10,n);return(x<0?-1:1)*Math.round(Math.abs(x)*f)/f}
function isLastFeb(p){return p.m===2&&p.d===dim(p.y,2)}
function yearfrac30(a,b){ /* Sheets YEARFRAC, basis 0 (US 30/360) */
  var d1=a.d,d2=b.d;
  if(isLastFeb(a)&&isLastFeb(b))d2=30;
  if(isLastFeb(a))d1=30;
  if(d2===31&&d1>=30)d2=30;
  if(d1===31)d1=30;
  return((b.y-a.y)*360+(b.m-a.m)*30+(d2-d1))/360;
}
function contractLabel(c){
  if(c.label)return c.label;
  var s=P(c.start);
  return (c.customer||'New contract')+(s?'-'+s.y+'-'+MON[s.m-1]:'');
}
function buildSchedule(pattern,alloc,st,en,recogIdx){
  var map=new Map(),startIdx=ymi(st.y,st.m),meta={};
  if(pattern==='As Delivered'){map.set(recogIdx!=null?recogIdx:startIdx,alloc);meta.point=true;return{map:map,meta:meta}}
  var days=dayNum(en)-dayNum(st)+1,rate=alloc/days,i0=startIdx,i1=ymi(en.y,en.m);
  meta.days=days;meta.rate=rate;
  meta.firstDays=(i0===i1)?days:dim(st.y,st.m)-st.d+1;
  meta.lastDays=(i0===i1)?days:en.d;
  for(var i=i0;i<=i1;i++){
    var d;
    if(i0===i1)d=days;else if(i===i0)d=meta.firstDays;else if(i===i1)d=meta.lastDays;else{var q=fromYmi(i);d=dim(q.y,q.m)}
    var tgt=(recogIdx!=null&&i<recogIdx)?recogIdx:i;
    map.set(tgt,(map.get(tgt)||0)+d*rate);
  }
  return{map:map,meta:meta};
}
function pickSsp(ssp,sku,startStr){
  var c=ssp.filter(function(x){return x.sku===sku});
  if(!c.length)return null;
  var ok=c.filter(function(x){return !x.effective||(startStr&&x.effective<=startStr)}),pick,early=false;
  if(ok.length)pick=ok.reduce(function(a,b){return(b.effective||'')>=(a.effective||'')?b:a});
  else{pick=c.reduce(function(a,b){return(b.effective||'')<(a.effective||'')?b:a});early=true}
  return{row:pick,early:early};
}
function sspNote(label,pk,startStr){
  var eff=pk.row.effective;
  return{col:'SSP tab',label:label,how:pk.early?'No version of this SSP was effective on the start date ('+startStr+'), so the earliest version is used.':'The latest version effective on or before the start date ('+startStr+').',val:eff?'Effective '+eff:'Original version (no effective date)',fmt:'text'};
}
function computeContract(c,ssp){
  if(c.mode==='usage')return computeUsage(c,ssp);
  var res={c:c,uid:c.uid,label:contractLabel(c),customer:c.customer||'(no name)',issues:[],lines:[],ok:false,tcv:+c.tcv||0,steps:[]};
  var st=P(c.start),en=P(c.end);
  if(!st||!en)res.issues.push('Enter the start and end dates.');
  else if(dayNum(en)<dayNum(st))res.issues.push('The end date is before the start date.');
  if(!(res.tcv>0))res.issues.push('Enter the total contract value.');
  var lic=c.license||{},pl=pickSsp(ssp,lic.sku,c.start),L=pl&&pl.row;
  if(!L)res.issues.push('Choose a license SKU.');
  var sup=c.support||{},ps=sup.sku?pickSsp(ssp,sup.sku,c.start):null,S=ps&&ps.row;
  if(sup.sku&&!S)res.issues.push('The support SKU is not in the SSP table.');
  if(res.issues.length)return res;
  var tm=xround(yearfrac30(st,en)*12,2),ty=tm/12;
  res.termMonths=tm;res.termYears=ty;res.sspUsed={license:{eff:L.effective||'',early:pl.early}};if(S)res.sspUsed.support={eff:S.effective||'',early:ps.early};
  res.steps.push({col:'M, N',label:'Contract term',how:'Months = ROUND(YEARFRAC(start, end) × 12, 2). Years = months ÷ 12.',val:tm.toFixed(2)+' months, '+ty.toFixed(4)+' years',fmt:'text'});
  var isGB=/GB/i.test(L.unit||''),units,unitsHow;
  if(lic.unitsOverride!==''&&lic.unitsOverride!=null&&!isNaN(+lic.unitsOverride)){units=+lic.unitsOverride;unitsHow='Entered by you in "Units override".'}
  else if(isGB){units=(+lic.gb||0)*(+lic.qty||0)*ty;unitsHow='Data size (GB) × quantity × term years.'}
  else{units=ty;unitsHow='Unlimited license is priced per year, so units = term years.'}
  if(!(units>0)){res.issues.push('License units come to zero. Enter a quantity and data size, or a units override.');return res}
  var ap=null,aq,aqHow;
  if(!L.ssp){
    ap=(+lic.listPrice||0)/units;
    if(ap>L.low&&ap<L.high){aq=ap;aqHow='Contract price per unit is inside the SSP range ('+L.low+' to '+L.high+'), so it is used as the SSP.'}
    else{aq=L.med;aqHow='Contract price per unit is outside the SSP range ('+L.low+' to '+L.high+'), so the median is used.'}
  }else{aq=L.ssp;aqHow='Fixed SSP from the SSP table.'}
  var licRsp=aq*units;
  var lines=[];
  var licSteps=[
    sspNote('SSP version used for the license',pl,c.start),
    {col:'AR',label:'Units',how:unitsHow,val:units,fmt:'num4'},
    {col:'AP',label:'Contract price per unit',how:'Price used for the SSP test ÷ units.',val:ap,fmt:'usd2'},
    {col:'AQ',label:'Standalone selling price (SSP)',how:aqHow,val:aq,fmt:'usd2'},
    {col:'AS',label:'Relative selling price',how:'SSP × units.',val:licRsp,fmt:'usd'}
  ];
  lines.push({key:'license',stream:L.stream||'License',sku:L.sku,gl:L.gl,pattern:L.pattern,units:units,aq:aq,rsp:licRsp,steps:licSteps});
  if(S){
    var sAq=S.ssp||S.med,sRsp=sAq*ty*licRsp;
    lines.push({key:'support',stream:S.stream||'Support',sku:S.sku,gl:S.gl,pattern:S.pattern,units:ty,aq:sAq,rsp:sRsp,steps:[
      sspNote('SSP version used for support',ps,c.start),
      {col:'AR',label:'Units',how:'Support is priced per year, so units = term years.',val:ty,fmt:'num4'},
      {col:'AQ',label:'Support rate',how:'Support as a share of the license, from the SSP table.',val:sAq,fmt:'pct'},
      {col:'AS',label:'Relative selling price',how:'Support rate × term years × the license relative selling price.',val:sRsp,fmt:'usd'}
    ]});
  }
  var total=lines.reduce(function(a,l){return a+l.rsp},0);
  res.totalRsp=total;
  var recogIdx=null;
  if(c.recogFrom){var m=/^(\d{4})-(\d{2})$/.exec(c.recogFrom);if(m){var ri=ymi(+m[1],+m[2]);if(ri>ymi(st.y,st.m))recogIdx=ri}}
  lines.forEach(function(l){
    l.pct=l.rsp/total;l.alloc=l.pct*res.tcv;
    l.steps.push({col:'AT',label:'Total relative selling price of the contract',how:'Sum of the relative selling prices of all lines.',val:total,fmt:'usd'});
    l.steps.push({col:'AU',label:'Share of the contract',how:'Line relative selling price ÷ contract total.',val:l.pct,fmt:'pct2'});
    l.steps.push({col:'AV',label:'Allocated price',how:'Share × total contract value ('+Math.round(res.tcv).toLocaleString('en-US')+').',val:l.alloc,fmt:'usd'});
    var sc=buildSchedule(l.pattern,l.alloc,st,en,recogIdx);
    l.map=sc.map;l.meta=sc.meta;
    if(sc.meta.point){
      l.steps.push({col:'AW',label:'Recognition pattern',how:'"As Delivered": the whole allocated price is recognized in one month.',val:'As Delivered',fmt:'text'});
      var mi=recogIdx!=null?recogIdx:ymi(st.y,st.m);
      l.steps.push({col:'BC onward',label:'Month recognized',how:recogIdx!=null?'Contract effective after the start date, so recognition begins in the "Recognize from" month.':'Month of the start date.',val:monLabel(mi),fmt:'text'});
    }else{
      l.steps.push({col:'AW',label:'Recognition pattern',how:'"Ratable": spread evenly by day across the term.',val:'Ratable',fmt:'text'});
      l.steps.push({col:'AX',label:'Daily rate',how:'Allocated price ÷ days from start to end, inclusive.',val:l.alloc/sc.meta.days,fmt:'usd4'});
      l.steps.push({col:'AY, AZ',label:'Days in first and last month',how:'First month counts from the start date. Last month counts to the end date.',val:sc.meta.firstDays+' days, '+sc.meta.lastDays+' days',fmt:'text'});
      l.steps.push({col:'BA, BB',label:'Revenue in first and last month',how:'Days × daily rate. Months in between use the calendar days in that month.',val:{a:sc.meta.firstDays*sc.meta.rate,b:sc.meta.lastDays*sc.meta.rate},fmt:'pair'});
      if(recogIdx!=null)l.steps.push({col:'',label:'Catch-up',how:'Revenue earned before '+monLabel(recogIdx)+' is recognized in '+monLabel(recogIdx)+'.',val:'Catch-up in '+monLabel(recogIdx),fmt:'text'});
    }
  });
  res.lines=lines;res.ok=true;
  var bd=P(c.invoiceDate)||P(c.effective)||st;
  var extra=(c.invoices||[]).filter(function(x){return P(x.date)&&x.amount!==''&&x.amount!=null&&!isNaN(+x.amount)});
  var hasExtra=extra.length>0;
  var primary=(c.invoiced!==''&&c.invoiced!=null&&!isNaN(+c.invoiced))?+c.invoiced:(hasExtra?0:res.tcv);
  res.bills=[{idx:ymi(bd.y,bd.m),amt:primary}];
  extra.forEach(function(x){var p=P(x.date);res.bills.push({idx:ymi(p.y,p.m),amt:+x.amount})});
  return res;
}
/* ----- usage-based contracts ----- */
function computeUsage(c,ssp){
  var u=c.usage||{};
  var res={c:c,uid:c.uid,label:contractLabel(c),customer:c.customer||'(no name)',issues:[],lines:[],ok:false,tcv:0,steps:[],mode:'usage'};
  var st=P(c.start),en=P(c.end);
  if(!st||!en)res.issues.push('Enter the start and end dates.');
  else if(dayNum(en)<dayNum(st))res.issues.push('The end date is before the start date.');
  var pk=u.sku?pickSsp(ssp,u.sku,c.start):null,S=pk&&pk.row;
  var hasOvr=u.rateOverride!==''&&u.rateOverride!=null&&!isNaN(+u.rateOverride);
  var rate=hasOvr?+u.rateOverride:(S?(+S.ssp||0):0);
  if(!hasOvr&&!S)res.issues.push('Choose a usage SKU or enter a rate.');
  else if(!(rate>0))res.issues.push('The usage rate is zero. Set the SSP for this SKU in Settings, or enter a rate override.');
  var byIdx={};
  (u.months||[]).forEach(function(m){
    var mm=/^(\d{4})-(\d{2})$/.exec(m.ym||'');

/* ----- report ----- */
function niceScale(min,max,n){
  var span=Math.max(max-min,1e-9),raw=span/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),nm=raw/mag;
  var step=(nm<=1?1:nm<=2?2:nm<=2.5?2.5:nm<=5?5:10)*mag;
  return{min:Math.floor(min/step)*step,max:Math.ceil(max/step)*step,step:step};
}
function legendHtml(series){
  var has={License:0,Support:0,Usage:0};series.forEach(function(s){has.License+=s.License;has.Support+=s.Support;has.Usage+=s.Usage});
  return '<div class="legend">'+[['License','license'],['Support','support'],['Usage','usage']].filter(function(x){return has[x[0]]>0}).map(function(x){return '<span><i style="background:var(--'+x[1]+')"></i>'+x[0]+'</span>'}).join('')+'</div>';
}
function chartRevenue(periods,series,selKey){
  var W=640,H=250,m={l:56,r:12,t:12,b:34},pw=W-m.l-m.r,ph=H-m.t-m.b,n=periods.length;
  var tot=series.map(function(s){return s.License+s.Support+s.Usage});
  var sc=niceScale(0,Math.max.apply(null,tot.concat([1])),4);
  var y=function(v){return m.t+ph-(v-sc.min)/(sc.max-sc.min)*ph};
  var bw=pw/n,w=Math.min(bw*.62,46);
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Revenue recognized by period, split by revenue stream">';

function chartBridge(b,label){
  var W=520,H=250,m={l:12,r:12,t:26,b:40};
  var bars=[{name:'Opening',from:0,to:b.open,color:'var(--total)',kind:'total'},{name:'Billings',from:b.open,to:b.open+b.billings,color:'var(--bill)',kind:'up'}];
  var run=b.open+b.billings;
  [['License','license',b.license],['Support','support',b.support],['Usage','usage',b.usage]].forEach(function(x){
    if(!b.present[x[0]])return;
    bars.push({name:x[0]+' revenue',from:run,to:run-x[2],color:'var(--'+x[1]+')',kind:'down'});run-=x[2];
  });
  bars.push({name:'Closing',from:0,to:b.close,color:'var(--total)',kind:'total'});
  var vals=[0];bars.forEach(function(x){vals.push(x.from,x.to)});
  var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);
  if(hi-lo<1){hi=lo+1}
  var pad=(hi-lo)*0.06,sc=niceScale(lo-(lo<0?pad:0),hi+pad,4);
  var ph=H-m.t-m.b,pw=W-m.l-m.r,bw=pw/bars.length,w=Math.min(bw*.62,60);
  var y=function(v){return m.t+ph-(v-sc.min)/(sc.max-sc.min)*ph};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Contract liability bridge for '+esc(label)+'">';
  s+='<line class="grid" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y(0)+'" y2="'+y(0)+'"/>';
  bars.forEach(function(x,i){
    var cx=m.l+bw*(i+.5),top=Math.min(y(x.from),y(x.to)),h=Math.max(Math.abs(y(x.from)-y(x.to)),1);
    var delta=x.kind==='total'?x.to:(x.to-x.from);
    var tip=x.name+'\n'+(delta<0?'-':'')+usdS(Math.abs(delta));
    s+='<rect x="'+(cx-w/2)+'" y="'+top+'" width="'+w+'" height="'+h+'" fill="'+x.color+'" stroke="var(--surface)" stroke-width="1.5" data-tip="'+esc(tip)+'"/>';
    var val=x.kind==='total'?cmp(x.to):(x.kind==='up'?'+'+cmp(x.to-x.from):'-'+cmp(Math.abs(x.to-x.from)));
    var down=(x.to<x.from)||(x.kind==='total'&&x.to<0);
    s+='<text x="'+cx+'" y="'+(down?top+h+13:top-6)+'" font-size="12" font-weight="600" text-anchor="middle" style="fill:var(--ink)">'+val+'</text>';
    var words=x.name.split(' ');
    s+='<text x="'+cx+'" y="'+(H-20)+'" font-size="11.5" text-anchor="middle">'+esc(words[0])+'</text>'+(words[1]?'<text x="'+cx+'" y="'+(H-6)+'" font-size="11.5" text-anchor="middle">'+esc(words[1])+'</text>':'');
    if(i<bars.length-1)s+='<line x1="'+(cx+w/2)+'" x2="'+(m.l+bw*(i+1.5)-w/2)+'" y1="'+y(x.to)+'" y2="'+y(x.to)+'" stroke="var(--muted)" stroke-dasharray="3 3"/>';
  });
  return s+'</svg>';
}
function defaultRange(flat,gran){
  var lo=Infinity,hi=-Infinity;
  flat.rows.forEach(function(x){x.map.forEach(function(v,i){if(i<lo)lo=i;if(i>hi)hi=i})});
  if(!isFinite(lo)){var d=new Date();lo=ymi(d.getFullYear(),d.getMonth()+1);hi=lo+11}
  var cut=/^(\d{4})-(\d{2})$/.exec(S.settings.cutover||'');
  var from=cut?ymi(+cut[1],+cut[2]):lo;
  if(from>hi)from=lo;
  var cap=gran==='month'?35:gran==='quarter'?39:119;
  return{from:from,to:Math.min(hi,from+cap)};
}

  if(act==='copy'){var txt=exportJson();var ok=function(){say('Copied. Paste it into a file to keep a backup.');render()};var fail=function(){var ta=document.getElementById('paste');S.ui.import=txt;say('Copy was blocked here. The data is in the box below. Select it and copy.',true);render();var ta2=document.getElementById('paste');if(ta2){ta2.focus();ta2.select()}};
    try{navigator.clipboard.writeText(txt).then(ok,fail)}catch(err){fail()}return}
  if(act==='download'){try{var bl=new Blob([exportJson()],{type:'application/json'}),u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download='rev-rec-ledger.json';document.body.appendChild(a);a.click();a.remove();say('If a file did not download, use Copy data instead.')}catch(err){say('Download is not available here. Use Copy data instead.',true)}render();return}
  if(act==='loadpaste'){var ta=document.getElementById('paste');importData(ta?ta.value:'');render();return}
  if(act==='demo'){S.contracts=demo();S.ssp=SSP0.map(function(x){return Object.assign({},x)});S.settings={fyStart:1,cutover:'',currency:'USD'};S.ui.sel=S.contracts[0].uid;S.ui.rep={gran:'quarter',from:'',to:'',drill:{},period:null};say('Loaded 6 example contracts.');save();render();return}
  if(act==='clear'){S.ui.confirm='clear';render();return}
  if(act==='clearok'){S.contracts=[];S.ui.sel=null;S.ui.confirm='';say('All contracts removed.');save();render();return}
});
var STRUCT={'mode':1,'license.sku':1,'support.sku':1,'usage.sku':1,'usage.tierOn':1,'usage.tierType':1,'usage.expire':1};
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='calcToggle'){S.ui.calc=t.checked;render();return}
  if(t.id==='file'){var f=t.files&&t.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){importData(String(rd.result));render()};rd.readAsText(f);return}
  if(t.dataset.p!=null){var c=cur();if(!c)return;var v=t.dataset.num?(t.value===''?'':Number(t.value)):t.value;setPath(c,t.dataset.p,v);if(t.dataset.p==='mode'&&v==='usage')ensureUsage(c);save();if(STRUCT[t.dataset.p])render();else refresh();return}
  if(t.dataset.ssp!=null){var pr=t.dataset.ssp.split('.'),row=S.ssp[+pr[0]];row[pr[1]]=t.dataset.num?(t.value===''?0:Number(t.value)):t.value;save();return}
  if(t.dataset.set!=null){S.settings[t.dataset.set]=t.dataset.set==='fyStart'?+t.value:t.value;S.ui.rep.from='';S.ui.rep.to='';S.ui.rep.period=null;save();return}
  if(t.dataset.rep!=null){S.ui.rep[t.dataset.rep]=t.value;if(t.dataset.rep==='gran'){S.ui.rep.period=null}render();return}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){S.ui.q=t.value;var l=document.getElementById('list');if(l)l.innerHTML=listHtml(results())}
  if(t.id==='paste')S.ui.import=t.value;
});
/* tooltip */
var tip=document.getElementById('tip');
function showTip(e){var t=e.target.closest('[data-tip]');if(!t){tip.style.display='none';return}tip.textContent=t.getAttribute('data-tip');tip.style.display='block';var x=(e.clientX||0)+14,y=(e.clientY||0)+14;if(!e.clientX){var b=t.getBoundingClientRect();x=b.left+b.width/2;y=b.top}tip.style.left=Math.min(x,innerWidth-tip.offsetWidth-8)+'px';tip.style.top=Math.min(y,innerHeight-tip.offsetHeight-8)+'px'}
document.addEventListener('mousemove',showTip);document.addEventListener('mouseleave',function(){tip.style.display='none'});
document.addEventListener('focusin',function(e){if(e.target.closest&&e.target.closest('[data-tip]'))showTip(e)});
document.addEventListener('focusout',function(){tip.style.display='none'});
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('hit')){e.preventDefault();S.ui.rep.period=e.target.dataset.key;render()}});
render();
})();
